[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "system-gap-master"
version = "1.6.1"
description = "Serverless cross-machine sync protocol and transfer yard for multi-machine AI agent operations"
readme = "README.md"
authors = [
    { name = "Lukas Geiger", email = "lukas@open-bricks.org" }
]
license = "MIT"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_LICENSES.md"]
requires-python = ">=3.10"
keywords = [
    "multi-agent",
    "serverless-sync",
    "cross-machine",
    "agent-state",
    "sync-protocol",
    "llm-agents",
    "slot-protocol"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Topic :: System :: Distributed Computing",
    "Topic :: System :: Networking",
    "Topic :: System :: Recovery Tools",
    "Topic :: Software Development :: Libraries :: Python Modules"
]
dependencies = [
    'tomli>=2.0.1; python_version < "3.11"',
]

[project.optional-dependencies]
trusted-peer-sftp = ["paramiko>=5,<6"]
# ticket-master ist ein eigenes Modul: gepinnte Git-Quelle statt blossem Paketnamen
# (Plan D 10.7). v1.12.0 ist der gegen den Adapter geprüfte Provider innerhalb
# der Kompatibilitätsgrenze >=1.12,<1.13 (AU-2026-09-12-C).
ticket-routing = [
    "ticket-master @ git+https://github.com/ellmos-ai/ticket-master@v1.12.0",
]

[project.scripts]
conflict-copy-reconciler = "system_gap_master.conflict_copy_reconciler:main"
trusted-peer-paths = "system_gap_master.trusted_peer_paths:main"
trusted-peer-sftp-executor = "system_gap_master.trusted_peer_sftp_executor:main"
republica-transit = "system_gap_master.republica_transit:main"
yard-instance-manager = "system_gap_master.instance_manager:main"

[project.urls]
Homepage = "https://github.com/ellmos-ai/system-gap-master"
Documentation = "https://github.com/ellmos-ai/system-gap-master/blob/main/PROTOCOL.md"
Repository = "https://github.com/ellmos-ai/system-gap-master"
Changelog = "https://github.com/ellmos-ai/system-gap-master/blob/main/CHANGELOG.md"
"Bug Tracker" = "https://github.com/ellmos-ai/system-gap-master/issues"
Security = "https://github.com/ellmos-ai/system-gap-master/blob/main/SECURITY.md"
"Third-Party Licenses" = "https://github.com/ellmos-ai/system-gap-master/blob/main/THIRD_PARTY_LICENSES.md"
"Marketing Log" = "https://github.com/ellmos-ai/system-gap-master/blob/main/MARKETING-LOG.txt"
"Parent Organization" = "https://github.com/ellmos-ai"
"Umbrella Ecosystem" = "https://github.com/open-bricks"
"LLM Ready" = "https://github.com/ellmos-ai/system-gap-master/blob/main/llms.txt"
Notice = "https://github.com/ellmos-ai/system-gap-master/blob/main/NOTICE"

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -v"
testpaths = ["tests"]
pythonpath = ["."]
norecursedirs = [".git", ".tox", ".nox", "dist", "build", "*.egg", "_build", ".hypothesis", ".venv", "venv"]

[tool.setuptools.packages.find]
include = ["system_gap_master*"]

[tool.setuptools.package-data]
system_gap_master = ["yard_template/**/*", "yard_template/*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4", "RUF"]
ignore = ["E501", "B007", "B904", "RUF100"]
