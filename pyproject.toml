[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "system-gap-master"
version = "1.4.0"
description = "Serverless cross-machine sync protocol and transfer yard for multi-machine AI agent operations"
readme = "README.md"
authors = [
    { name = "Lukas Geiger", email = "lukas@open-bricks.org" }
]
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = [
    "multi-agent",
    "serverless-sync",
    "cross-machine",
    "agent-state",
    "sync-protocol",
    "llm-agents",
    "slot-protocol"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Networking",
    "Topic :: Software Development :: Libraries :: Python Modules"
]
dependencies = []

[project.optional-dependencies]
trusted-peer-sftp = ["paramiko>=5,<6"]

[project.scripts]
conflict-copy-reconciler = "system_gap_master.conflict_copy_reconciler:main"
trusted-peer-paths = "system_gap_master.trusted_peer_paths:main"
trusted-peer-sftp-executor = "system_gap_master.trusted_peer_sftp_executor:main"
republica-transit = "system_gap_master.republica_transit:main"

[project.urls]
Homepage = "https://github.com/ellmos-ai/system-gap-master"
Documentation = "https://github.com/ellmos-ai/system-gap-master/blob/main/PROTOCOL.md"
Repository = "https://github.com/ellmos-ai/system-gap-master"
"Bug Tracker" = "https://github.com/ellmos-ai/system-gap-master/issues"

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["system_gap_master*"]
